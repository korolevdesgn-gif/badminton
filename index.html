<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Смэш мне в ногу</title>
<meta name="robots" content="noindex">

<meta property="og:site_name" content="Смэш мне в ногу">
<meta property="og:title" content="Смэш мне в ногу — бадминтон в браузере">
<meta property="og:description" content="Против ИИ или со мной по коду комнаты. Смэши, сетки и таблица побед.">

<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1215; color: #e8efe9; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  a { color: #ff6a3d; }
</style>
</head>
<body>
<p>Игра переехала на <a id="go" href="https://smash-v-nogu.github.io/">smash-v-nogu.github.io</a></p>
<script>
// Старый адрес: переносим профиль (id, имя, стиль) и код комнаты на новый адрес
(function () {
  var NEW = 'https://smash-v-nogu.github.io/';
  var params = location.search.replace(/^\?/, '').split('&').filter(function (x) { return x && x.indexOf('from=') !== 0; });
  var slot = (/[?&]p=(\d)\b/.exec(location.search) || [])[1] || '';
  try {
    var p = JSON.parse(localStorage.getItem('bdm-profile' + slot) || 'null');
    if (p && p.pid && p.name) {
      var b = btoa(unescape(encodeURIComponent(JSON.stringify({ pid: p.pid, name: p.name, style: p.style }))));
      params.push('from=' + b.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''));
    }
  } catch (e) {}
  var url = NEW + (params.length ? '?' + params.join('&') : '') + location.hash;
  document.getElementById('go').href = url;
  location.replace(url);
})();
</script>
</body>
</html>
